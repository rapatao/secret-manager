{{define "content"}}
<h1>Paths</h1>
<div class="card">
<h2>New path</h2>
<div class="body">
<form class="row" method="post" action="/path">
<input name="path" placeholder="/kubernetes/app" aria-label="Path" pattern="/([a-z0-9\-]+(/[a-z0-9\-]+)*)?" required>
<button type="submit" class="primary">Create</button>
</form>
</div>
</div>
<div class="card">
<div class="body">
<form class="row" method="get" action="/">
<input type="search" name="q" value="{{.Query}}" placeholder="Search paths" aria-label="Search paths">
<button type="submit">Search</button>
</form>
</div>
<table>
<tbody>
{{range .Paths}}
<tr><td><a class="path-link mono" href="/path?path={{. | urlquery}}">{{.}}</a></td></tr>
{{else}}
<tr><td class="empty">{{if .Query}}No paths match.{{else}}No paths yet. Create one above.{{end}}</td></tr>
{{end}}
</tbody>
</table>
</div>
{{with .Deleted}}
<div class="card">
<h2>Deleted paths <span class="badge">{{len .}}</span></h2>
<table>
<tbody>
{{range .}}
<tr><td><a class="path-link mono" href="/path?path={{. | urlquery}}">{{.}}</a></td></tr>
{{end}}
</tbody>
</table>
</div>
{{end}}
{{end}}
