{{define "content"}}
<h1>Paths</h1>
<div class="card">
<h2>New path</h2>
<div class="body">
<form class="row" method="post" action="/path">
<input name="path" placeholder="/kubernetes/app" aria-label="Path" pattern="/([a-z0-9\-]+(/[a-z0-9\-]+)*)?" required>
<button type="submit" class="primary">Create</button>
</form>
</div>
</div>
<div class="card">
<table>
<tbody>
{{range .Paths}}
<tr><td><a class="path-link mono" href="/path?path={{. | urlquery}}">{{.}}</a></td></tr>
{{else}}
<tr><td class="empty">No paths yet. Create one above.</td></tr>
{{end}}
</tbody>
</table>
</div>
{{end}}
