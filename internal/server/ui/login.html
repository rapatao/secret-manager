{{define "header"}}{{end}}
{{define "content"}}
<div class="login">
<div class="logo" aria-hidden="true">&#128273;</div>
<h1>secret-manager</h1>
<div class="card"><div class="body">
<form class="stack" method="post" action="/login">
{{with .Next}}<input type="hidden" name="next" value="{{.}}">{{end}}
<label>Admin token <input type="password" name="token" autocomplete="current-password" required autofocus></label>
<button type="submit" class="primary">Sign in</button>
</form>
</div></div>
</div>
{{end}}
