{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>secret-manager</title>
<script src="/ui.js" defer></script>
<style>
:root {
  --bg: #f6f8fa; --surface: #fff; --border: #d0d7de; --muted: #59636e; --fg: #1f2328;
  --accent: #0969da; --accent-fg: #fff; --danger: #cf222e; --danger-bg: #ffebe9;
  --code-bg: #eff2f5; --radius: 8px; --shadow: 0 1px 3px rgba(31,35,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --surface: #151b23; --border: #3d444d; --muted: #9198a1; --fg: #e6edf3;
    --accent: #4493f8; --accent-fg: #fff; --danger: #f85149; --danger-bg: #f8514926;
    --code-bg: #262c36; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, textarea, summary, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
header { background: var(--surface); border-bottom: 1px solid var(--border); }
header .bar { max-width: 60rem; margin: 0 auto; padding: .75rem 1rem; display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: .5rem; color: var(--fg); font-weight: 600; font-size: 1.05rem; }
.brand:hover { text-decoration: none; }
.logo { width: 1.6rem; height: 1.6rem; border-radius: 6px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-size: .9rem; }
main { max-width: 60rem; margin: 1.5rem auto; padding: 0 1rem; }
h1 { font-size: 1.4rem; margin: 0 0 1rem; word-break: break-all; }
h2 { font-size: 1rem; margin: 0; padding: .75rem 1rem; border-bottom: 1px solid var(--border); }
h3 { font-size: 1rem; margin: 0 0 .5rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 1.25rem; overflow: hidden; }
.card > .body { padding: 1rem; }
.card.danger-zone { border-color: var(--danger); }
.card.danger-zone h2 { color: var(--danger); }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: .6rem 1rem; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--bg); }
td.actions { width: 1%; white-space: nowrap; text-align: right; }
td.empty { color: var(--muted); text-align: center; padding: 1.5rem; }
td table td { padding: .25rem .5rem; }
.path-link { display: block; }
.badge { display: inline-block; padding: 0 .5rem; border-radius: 999px; background: var(--code-bg); color: var(--muted); font-size: .8rem; }
.change { white-space: nowrap; }
code { background: var(--code-bg); padding: .1rem .35rem; border-radius: 4px; }
form.inline { display: inline; }
form.row { display: flex; gap: .5rem; flex-wrap: wrap; }
form.row input { flex: 1; min-width: 12rem; }
form.stack { display: grid; gap: .6rem; }
label { display: grid; gap: .3rem; font-weight: 500; }
input, textarea, button { font: inherit; color: inherit; }
input, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: .45rem .65rem; width: 100%; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
textarea { resize: vertical; }
button { cursor: pointer; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: .4rem .9rem; font-weight: 500; white-space: nowrap; }
button:hover { background: var(--bg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button.primary:hover { filter: brightness(1.08); }
button.danger { color: var(--danger); }
button.danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
button.small { padding: .2rem .6rem; font-size: .85rem; }
summary { cursor: pointer; color: var(--muted); user-select: none; }
summary:hover { color: var(--accent); }
details[open] summary { margin-bottom: .5rem; }
details form { display: grid; gap: .5rem; justify-items: start; }
.error { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger); border-radius: var(--radius); padding: .6rem 1rem; margin: 0 0 1rem; }
.muted { color: var(--muted); }
.login { max-width: 24rem; margin: 12vh auto 0; }
.login .logo { width: 2.5rem; height: 2.5rem; font-size: 1.3rem; margin: 0 auto .75rem; }
.login h1 { text-align: center; }
</style>
</head>
<body>
{{block "header" .}}
<header><div class="bar">
<a class="brand" href="/"><span class="logo" aria-hidden="true">&#128273;</span>secret-manager</a>
<form class="inline" method="post" action="/logout"><button type="submit" class="small">Sign out</button></form>
</div></header>
{{end}}
<main>
{{with .}}{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
