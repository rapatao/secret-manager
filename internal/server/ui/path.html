{{define "nav"}}<form class="inline" method="post" action="/logout"><button type="submit">Sign out</button></form>{{end}}
{{define "content"}}
<h2><code>{{.Path}}</code></h2>
<table>
<tr><th>Key</th><th>Value</th><th></th></tr>
{{$path := .Path}}
{{range .Entries}}
<tr>
<td><code>{{.Key}}</code></td>
<td>
<details><summary>show / edit</summary>
<form method="post" action="/key">
<input type="hidden" name="path" value="{{$path}}">
<input type="hidden" name="key" value="{{.Key}}">
<textarea name="value" rows="3">{{.Value}}</textarea>
<button type="submit">Save</button>
</form>
</details>
</td>
<td>
<form class="inline" method="post" action="/key/delete">
<input type="hidden" name="path" value="{{$path}}">
<input type="hidden" name="key" value="{{.Key}}">
<button type="submit" class="danger">Delete</button>
</form>
</td>
</tr>
{{else}}
<tr><td colspan="3">No keys yet.</td></tr>
{{end}}
</table>
<h3>Add key</h3>
<form method="post" action="/key">
<input type="hidden" name="path" value="{{.Path}}">
<p><input name="key" placeholder="KEY" pattern="[\-._a-zA-Z0-9]+" required></p>
<p><textarea name="value" rows="3" placeholder="value"></textarea></p>
<button type="submit">Save</button>
</form>
<h3 class="danger">Danger zone</h3>
<form method="post" action="/path/delete">
<input type="hidden" name="path" value="{{.Path}}">
<button type="submit" class="danger">Delete path {{.Path}}</button>
</form>
{{end}}
