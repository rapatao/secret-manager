apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secret-manager.fullname" . }}
  labels: {{- include "secret-manager.labels" . | nindent 4 }}
spec:
  # Writes are serialized in process, so exactly one replica may run.
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "secret-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "secret-manager.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "secret-manager.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [server, --addr=:8080, --metrics-addr=:8081, --log-level={{ .Values.logLevel }}, --history-limit={{ .Values.historyLimit }}, --last-used-flush={{ .Values.lastUsedFlush }}, --cache-max-age={{ .Values.cacheMaxAge }}, --controller={{ .Values.controller.enabled }}
            {{- with .Values.trustedProxies }}, --trusted-proxies={{ join "," . }}{{ end }}
            {{- with .Values.events }}, --events=reads={{ .reads }},lists={{ .lists }},logins={{ .logins }},backups={{ .backups }}{{ end }}
            {{- if .Values.backup.enabled }}, --backup-dir=/backups, --backup-interval={{ .Values.backup.interval }}, --backup-keep={{ .Values.backup.keep }}, --backup-history={{ .Values.backup.history }}{{ end }}]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SECRET_MANAGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.existingSecret is required" .Values.auth.existingSecret }}
                  key: {{ .Values.auth.key }}
            {{- with .Values.encryption.existingSecret }}
            - name: SECRET_MANAGER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.encryption.key }}
            {{- with $.Values.encryption.previousKey }}
            - name: SECRET_MANAGER_PREVIOUS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.encryption.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.backup.encryption.existingSecret }}
            - name: SECRET_MANAGER_BACKUP_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backup.encryption.existingSecret }}
                  key: {{ .Values.backup.encryption.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.backup.enabled }}
          volumeMounts:
            - name: backups
              mountPath: /backups
          {{- end }}
      {{- if .Values.backup.enabled }}
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: {{ .Values.backup.persistence.existingClaim | default (printf "%s-backups" (include "secret-manager.fullname" .)) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
