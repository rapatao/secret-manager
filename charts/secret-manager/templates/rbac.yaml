apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "secret-manager.fullname" . }}
  labels: {{- include "secret-manager.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "secret-manager.fullname" . }}
  labels: {{- include "secret-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, patch]
  - apiGroups: [secretmanager.rapatao.com]
    resources: [secretsyncs]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [secretmanager.rapatao.com]
    resources: [secretsyncs/status]
    verbs: [get, update, patch]
  - apiGroups: [secretmanager.rapatao.com]
    resources: [secretsyncs/finalizers]
    verbs: [update]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "secret-manager.fullname" . }}
  labels: {{- include "secret-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "secret-manager.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "secret-manager.fullname" . }}
    namespace: {{ .Release.Namespace }}
