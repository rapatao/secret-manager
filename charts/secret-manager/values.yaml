image:
  repository: ghcr.io/rapatao/secret-manager
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Secret holding the admin token (at least 32 characters) used by the CLI and
# the Web UI. Create it before installing, e.g.:
#   kubectl create secret generic secret-manager-token \
#     --from-literal=token="$(openssl rand -base64 36)"
auth:
  existingSecret: ""
  key: token

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: secrets.example.com
  tls: []
  #  - secretName: secrets-tls
  #    hosts:
  #      - secrets.example.com

# debug, info, warn or error.
logLevel: info

# Prometheus metrics are served on port 8081 (Service port "metrics").
metrics:
  serviceMonitor:
    # Requires the Prometheus Operator CRDs.
    enabled: false
    interval: ""
    labels: {}

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
