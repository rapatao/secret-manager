image:
  repository: ghcr.io/rapatao/secret-manager
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Secret holding the admin token (at least 32 characters) used by the CLI and
# the Web UI. Create it before installing, e.g.:
#   kubectl create secret generic secret-manager-token \
#     --from-literal=token="$(openssl rand -base64 36)"
auth:
  existingSecret: ""
  key: token

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: secrets.example.com
  tls: []
  #  - secretName: secrets-tls
  #    hosts:
  #      - secrets.example.com

# debug, info, warn or error.
logLevel: info

# Versions kept per path, current included. Each version is a Secret in the
# release namespace. 0 disables history.
historyLimit: 10

# Writes a backup of every path to a PersistentVolume every interval and keeps
# the newest files. Backups hold secret values in plain JSON.
backup:
  enabled: false
  interval: 24h
  keep: 7
  # Include the versions of every path.
  history: false
  persistence:
    # Use an existing PersistentVolumeClaim instead of creating one.
    existingClaim: ""
    size: 1Gi
    storageClass: ""

# Runs the SecretSync controller, which writes Secrets in any namespace and
# restarts workloads, with cluster-wide RBAC. When false, the server only
# stores secrets and its RBAC is limited to Secrets in the release namespace.
controller:
  enabled: true

# Prometheus metrics are served on port 8081 (Service port "metrics").
metrics:
  serviceMonitor:
    # Requires the Prometheus Operator CRDs.
    enabled: false
    interval: ""
    labels: {}

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
