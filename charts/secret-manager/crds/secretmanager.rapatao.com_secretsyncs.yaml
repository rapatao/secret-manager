---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: secretsyncs.secretmanager.rapatao.com
spec:
  group: secretmanager.rapatao.com
  names:
    kind: SecretSync
    listKind: SecretSyncList
    plural: secretsyncs
    singular: secretsync
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SecretSync syncs secret-manager paths into Kubernetes Secrets.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SecretSyncSpec defines the sources to read and the Secrets
              to write.
            properties:
              refreshInterval:
                default: 60s
                description: |-
                  RefreshInterval is the resync period. Changes made through
                  secret-manager are applied immediately.
                type: string
              sources:
                description: Sources are merged in order; later sources win on duplicate
                  keys.
                items:
                  description: Source is a secret path read by a SecretSync.
                  properties:
                    path:
                      description: Path of the secrets, like /kubernetes/app.
                      pattern: ^/([a-z0-9-]+(/[a-z0-9-]+)*)?/?$
                      type: string
                    recursive:
                      description: |-
                        Recursive also reads every path nested below Path. Paths are merged in
                        alphabetical order, so on duplicate keys a nested path wins over its
                        parents.
                      type: boolean
                  required:
                  - path
                  type: object
                minItems: 1
                type: array
              targets:
                items:
                  description: Target is a Secret written by a SecretSync.
                  properties:
                    creationPolicy:
                      default: Owner
                      description: |-
                        CreationPolicy defines what happens to a target Secret when its SecretSync
                        is deleted or the target is removed from the spec.
                      enum:
                      - Owner
                      - Orphan
                      type: string
                    metadata:
                      description: TargetMetadata is copied to the target Secret.
                      properties:
                        annotations:
                          additionalProperties:
                            type: string
                          type: object
                        labels:
                          additionalProperties:
                            type: string
                          type: object
                      type: object
                    name:
                      description: Name of the Secret.
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the Secret. Defaults to the SecretSync
                        namespace.
                      type: string
                    template:
                      description: Template shapes the Secret data. Without it every
                        source key is copied.
                      properties:
                        data:
                          additionalProperties:
                            type: string
                          description: |-
                            Data maps each target key to a Go template. Source values are available
                            as {{ .KEY }}.
                          type: object
                      required:
                      - data
                      type: object
                    type:
                      description: Type of the Secret. Defaults to Opaque.
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
            required:
            - sources
            - targets
            type: object
          status:
            description: SecretSyncStatus is the observed state of a SecretSync.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncedHash:
                description: LastSyncedHash is the hash of the source data last written.
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
